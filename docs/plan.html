<title>백혈구 분류 작업계획표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Gothic+A1:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">

<style>
  :root {
    /* 라이트-김자 염색 이미지에서 가져온 팔레트 */
    --nucleus:   #6B4EA8;   /* 핵의 보라 — 이 문서의 액센트 */
    --nucleus-2: #8B6FC4;
    --erythro:   #C2565B;   /* 적혈구의 붉은빛 — 경고·미달 */
    --granule:   #B8862F;   /* 과립의 황갈색 — 진행 중 */
    --verified:  #4A7C59;   /* 통과 */

    --ground:   #F6F2EA;
    --surface:  #FFFDF8;
    --raised:   #FFFFFF;
    --line:     #E2D9CA;
    --hairline: #EDE6DA;

    --ink:   #2A2320;
    --ink-2: #5C5148;
    --ink-3: #8A7F73;

    --serif: "Noto Serif KR", Batang, serif;
    --sans:  "Gothic A1", "Malgun Gothic", system-ui, sans-serif;
    --mono:  "JetBrains Mono", Consolas, monospace;

    --measure: 66ch;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --nucleus:   #AE8FE6;
      --nucleus-2: #C4ABF0;
      --erythro:   #E38A8E;
      --granule:   #D9AC57;
      --verified:  #7FBF92;

      --ground:   #171319;
      --surface:  #1E1A22;
      --raised:   #262130;
      --line:     #372F40;
      --hairline: #2A2431;

      --ink:   #EDE7F2;
      --ink-2: #ABA1B5;
      --ink-3: #7D7488;
    }
  }

  :root[data-theme="dark"] {
    --nucleus:   #AE8FE6;
    --nucleus-2: #C4ABF0;
    --erythro:   #E38A8E;
    --granule:   #D9AC57;
    --verified:  #7FBF92;

    --ground:   #171319;
    --surface:  #1E1A22;
    --raised:   #262130;
    --line:     #372F40;
    --hairline: #2A2431;

    --ink:   #EDE7F2;
    --ink-2: #ABA1B5;
    --ink-3: #7D7488;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 860px; margin: 0 auto; padding: 44px 24px 100px; }

  /* ---------- 헤더 ---------- */

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--nucleus);
    margin: 0 0 12px;
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(30px, 5.2vw, 44px);
    font-weight: 700;
    letter-spacing: -.015em;
    line-height: 1.25;
    text-wrap: balance;
    margin: 0 0 14px;
  }

  .lede { max-width: var(--measure); color: var(--ink-2); margin: 0 0 22px; }

  .disclaimer {
    display: flex;
    gap: 11px;
    align-items: flex-start;
    max-width: var(--measure);
    padding: 13px 16px;
    margin-bottom: 30px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--erythro);
    border-radius: 2px;
    font-size: 13.5px;
    color: var(--ink-2);
  }

  .disclaimer b { color: var(--erythro); font-weight: 700; flex: none; }

  /* ---------- 현황 ---------- */

  .status {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .stat { background: var(--surface); padding: 13px 15px; }
  .stat dt { font-size: 11px; letter-spacing: .05em; color: var(--ink-3); margin: 0 0 3px; }
  .stat dd {
    margin: 0;
    font-family: var(--mono);
    font-size: 21px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }
  .stat dd small { font-size: 12px; font-weight: 400; color: var(--ink-3); }

  .meter {
    height: 6px;
    background: var(--line);
    border-radius: 1px;
    overflow: hidden;
    margin-bottom: 44px;
  }
  .meter span {
    display: block;
    height: 100%;
    background: var(--nucleus);
    transition: width .35s cubic-bezier(.2,.7,.3,1);
  }

  /* ---------- 성공 기준 ---------- */

  .sec-label {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 14px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--line);
  }

  .criteria { margin-bottom: 48px; }

  .crit {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    gap: 0 14px;
    align-items: baseline;
    padding: 9px 0;
    border-bottom: 1px solid var(--hairline);
    font-size: 14px;
  }
  .crit:last-child { border-bottom: none; }

  .crit-id {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--nucleus);
  }
  .crit-goal { color: var(--ink-3); font-size: 12.5px; display: block; }
  .crit-val {
    font-family: var(--mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .crit-val.pass { color: var(--verified); }
  .crit-val.pending { color: var(--ink-3); }
  .crit-val.partial { color: var(--granule); }

  /* ---------- 주차 ---------- */

  .week {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 52px 0 6px;
    padding-bottom: 11px;
    border-bottom: 2px solid var(--ink);
  }
  .week h2 {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 700;
    margin: 0;
  }
  .week .range {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 일차 ---------- */

  .day { padding: 24px 0; border-bottom: 1px solid var(--hairline); }

  .day.is-today {
    background: var(--raised);
    border: 1px solid var(--nucleus);
    border-radius: 3px;
    padding: 22px 22px 24px;
    margin: 12px 0;
  }

  .day-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 12px;
    margin-bottom: 3px;
  }

  .day-no {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .1em;
    color: var(--ink-3);
    flex: none;
  }
  .day.is-today .day-no { color: var(--nucleus); }
  .day.is-done .day-title { color: var(--ink-3); }

  .day-title {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -.01em;
  }

  .date {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .hours {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }

  .tag {
    font-family: var(--mono);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 2px;
    border: 1px solid currentColor;
    flex: none;
  }
  .tag.done { color: var(--verified); }
  .tag.key  { color: var(--erythro); }
  .tag.buf  { color: var(--granule); }

  .note { max-width: var(--measure); font-size: 13.5px; color: var(--ink-2); margin: 6px 0 14px; }

  /* 실제로 나온 결과를 계획 옆에 붙인다 — 계획과 결과가 다른 곳에 있으면
     둘 중 하나는 반드시 낡는다. */
  .outcome {
    max-width: var(--measure);
    font-size: 13px;
    color: var(--ink-2);
    margin: -6px 0 14px;
    padding: 9px 13px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-left: 3px solid var(--verified);
    border-radius: 0 2px 2px 0;
  }
  .outcome b {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--verified);
    margin-right: 7px;
  }

  .tasks { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 1px; }
  .tasks li { display: flex; }
  .tasks label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 3px 0;
    cursor: pointer;
    font-size: 14px;
    max-width: var(--measure);
  }
  .tasks input {
    appearance: none;
    width: 15px; height: 15px;
    margin: 5px 0 0;
    flex: none;
    border: 1.5px solid var(--line);
    border-radius: 2px;
    background: var(--surface);
    cursor: pointer;
    display: grid;
    place-content: center;
    transition: background .12s, border-color .12s;
  }
  .tasks input::after {
    content: "";
    width: 8px; height: 4.5px;
    border-left: 2px solid var(--surface);
    border-bottom: 2px solid var(--surface);
    transform: rotate(-45deg) translate(1px, -1px);
    opacity: 0;
  }
  .tasks input:checked { background: var(--nucleus); border-color: var(--nucleus); }
  .tasks input:checked::after { opacity: 1; }
  .tasks input:focus-visible { outline: 2px solid var(--nucleus); outline-offset: 2px; }
  .tasks input:checked + span { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line); }

  .day-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    align-items: baseline;
    max-width: var(--measure);
    font-size: 12.5px;
    color: var(--ink-2);
  }
  .day-foot .lbl {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-right: 6px;
  }
  .advances { display: flex; gap: 5px; }
  .advances i {
    font-family: var(--mono);
    font-style: normal;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--nucleus);
    border: 1px solid var(--nucleus);
    border-radius: 2px;
    padding: 0 5px;
  }

  /* ---------- 우선순위 ---------- */

  .fallback {
    margin-top: 56px;
    padding: 24px 26px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--granule);
    border-radius: 2px;
  }
  .fallback h3 { font-family: var(--serif); font-size: 17px; margin: 0 0 8px; }
  .fallback p { font-size: 13.5px; color: var(--ink-2); margin: 0 0 16px; max-width: var(--measure); }
  .fallback ol { margin: 0; padding-left: 20px; font-size: 13.5px; display: flex; flex-direction: column; gap: 6px; }
  .fallback ol span { color: var(--ink-3); }

  .save-note { margin-top: 30px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

  @media (max-width: 560px) {
    .wrap { padding: 30px 16px 76px; }
    .hours { margin-left: 0; }
    .crit { grid-template-columns: 30px 1fr; }
    .crit-val { grid-column: 2; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
